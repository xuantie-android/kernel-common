%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/samsung,s6d6ft0.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S6D6FT0 integrated touch controller

maintainers:
  - LoveSy <shana@zju.edu.cn>

description: |
  Samsung S6D6FT0 touch controller integrated into TL060FVXS07 panels.
  The controller uses eight-byte coordinate events over I2C. Panel power
  and reset are shared with the display and are managed by the board's
  display integration, not independently toggled by this touch driver.

allOf:
  - $ref: touchscreen.yaml#

properties:
  compatible:
    const: samsung,s6d6ft0
  reg:
    maxItems: 1
  interrupts:
    maxItems: 1
  irq-gpios:
    maxItems: 1
    description: Active-low interrupt pin, configured as input only.

required:
  - compatible
  - reg
  - interrupts
  - touchscreen-size-x
  - touchscreen-size-y

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/gpio/gpio.h>
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;
        touchscreen@48 {
            compatible = "samsung,s6d6ft0";
            reg = <0x48>;
            interrupt-parent = <&gpio>;
            interrupts = <3 IRQ_TYPE_LEVEL_LOW>;
            irq-gpios = <&gpio 3 GPIO_ACTIVE_LOW>;
            touchscreen-size-x = <1080>;
            touchscreen-size-y = <2160>;
        };
    };
